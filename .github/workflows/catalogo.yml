name: Regenerar schema del catálogo

# Cuando cambia products.json (un precio, un producto agotado), se regenera
# solo el bloque de datos estructurados que leen Google y el catálogo de Meta.
on:
  push:
    branches: [main]
    paths: ['products.json']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Regenerar el schema
        run: node scripts/build-schema.js

      - name: Publicar si cambió
        run: |
          set -euo pipefail
          if git diff --quiet -- tienda/index.html; then
            echo "El schema ya estaba al día."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tienda/index.html
          git commit -m "Schema del catálogo regenerado desde products.json"
          git push
